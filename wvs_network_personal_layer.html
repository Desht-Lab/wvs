<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WVS-7: личный слой — оси и измерения</title>
  <script src="https://cdn.jsdelivr.net/npm/d3plus@2"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #376C8A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .title { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    .status { font-size: 13px; color: var(--muted); text-align: right; }

    .viz-shell {
      height: calc(100vh - 64px);
      padding: 10px;
      background: var(--bg);
    }

    .layout {
      height: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .filter-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .filter-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .filter-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }

    .filter-help,
    .filter-summary {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .filter-summary { margin-top: 6px; }

    .filter-controls {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }

    .filter-search {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      color: var(--text);
      background: #ffffff;
    }

    .filter-actions { display: flex; gap: 8px; }

    .filter-inline {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .filter-button {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .filter-button:hover { background: #f9fafb; }
    .filter-button-small { min-width: 72px; }

    /* ── cluster filter section ── */
    .cluster-filter-section {
      flex: 1 1 50%;               /* займёт всё оставшееся место панели */
      min-height: 0;                /* критично: разрешает сжатие внутри flex */
      display: flex;
      flex-direction: column;
      padding: 10px 14px 12px;
      border-bottom: 1px solid var(--border);
      background: #f9fafb;
      overflow: hidden;             /* заголовок фиксирован, скроллит внутренний список */
    }

    .cluster-filter-title {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cluster-filter-clear {
      font-size: 11px;
      font-weight: 400;
      color: var(--accent);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
    }

    .cluster-filter-clear:hover { text-decoration: underline; }

    .cluster-chips {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;             /* ← вот здесь и появляется прокрутка */
      padding-right: 4px;           /* чтобы скроллбар не наезжал на чипы */
    }

    .cluster-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text);
      background: #ffffff;
      transition: background 0.1s;
      user-select: none;
    }

    .cluster-chip:hover { background: #f3f4f6; }

    .cluster-chip.active {
      border-color: currentColor;
      background: #ffffff;
    }

    .cluster-chip-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .cluster-chip-name {
      flex: 1;
      min-width: 0;
    }

    .cluster-chip-count {
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── node list ── */
    .filter-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .filter-item {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .filter-item:hover { background: #f9fafb; }
    .filter-item input { margin: 2px 0 0; }

    .filter-item-id {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .filter-item-label {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      word-break: break-word;
    }

    .filter-empty { padding: 10px; font-size: 12px; color: var(--muted); }

    #viz {
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 260px minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">WVS-7 · личный слой: 358 характеристик, 423 ребра · 61 ось · 25 измерений</div>
    <div id="status" class="status">Loading data...</div>
  </div>
  <div class="viz-shell">
    <div class="layout">
      <aside class="panel filter-panel">
        <div class="filter-header">
          <div class="filter-title">Фильтр</div>
          <div class="filter-help">Страна подсвечивает характеристики, по которым у неё специализация (RCA ≥ 1). Измерения — фильтр, ищутся поиском; с страной работают как пересечение.</div>
          <div id="filter-summary" class="filter-summary">Загрузка...</div>
        </div>

        <div class="filter-controls">
          <div class="filter-inline">
            <input id="country-filter" class="filter-search" type="search"
                   list="country-filter-options" placeholder="Поиск страны (ISO)">
            <button id="clear-country-filter" class="filter-button filter-button-small"
                    type="button">Очистить</button>
          </div>
          <datalist id="country-filter-options"></datalist>

          <input id="node-search" class="filter-search" type="search"
                 placeholder="Поиск по коду или названию">

          <div class="filter-actions">
            <button id="select-visible" class="filter-button" type="button">Показать найденные</button>
            <button id="clear-selection" class="filter-button" type="button">Показать все</button>
          </div>
        </div>

        <div class="cluster-filter-section">
          <div class="cluster-filter-title">
            <span>Измерение</span>
            <button id="clear-dim-filter" class="cluster-filter-clear" type="button">Сбросить</button>
          </div>
          <input id="dim-search" class="filter-search" type="search"
                 placeholder="Поиск измерения" style="margin-bottom:8px; flex:0 0 auto;">
          <div id="dim-chips" class="cluster-chips"></div>
        </div>

      </aside>

      <div id="viz" class="panel"></div>
    </div>
  </div>

  <script>
    // ФАЙЛЫ ДАННЫХ — при выкладке на GitHub Pages переименовать здесь же
    const NODES_FILE = "nodes_personal_layer.json";   // из ноутбука: id, label, title, x, y, color, dimension, axis, pole
    const EDGES_FILE = "edges_personal_layer.csv";    // u, v, sim, source
    const SPEC_FILE  = "spec_personal_layer.csv";     // B_COUNTRY_ALPHA + столбцы-характеристики, 1 = RCA ≥ 1

    const state = {
      allNodes: [], allLinks: [],
      countryIndicatorMap: new Map(), countryNameMap: new Map(), countryLookup: new Map(),
      nodeDimMap: new Map(), nodeAxisMap: new Map(),
      dimList: [], axisList: [],
      availableYears: [], selectedCountryId: "", selectedYear: null,
      selectedNodeIds: new Set(), selectedDims: new Set(), selectedAxes: new Set(),
      visibleNodeIds: []
    };
    const mutedNodeColor = "#c7cdd6";

    /* ── helpers ── */
    function num(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function formatTooltipText(value) {
      return String(value || "").replace(/<br\s*\/?>/gi, " | ").replace(/\s+/g, " ").trim();
    }

    function getNodeSortNumber(nodeId) {
      const sdgMatch = String(nodeId || "").match(/sdg(\d+)/i);
      if (sdgMatch) return Number(sdgMatch[1]);
      const anyNumberMatch = String(nodeId || "").match(/(\d+)/);
      return anyNumberMatch ? Number(anyNumberMatch[1]) : Number.POSITIVE_INFINITY;
    }

    function compareNodesByIdNumber(a, b) {
      const aNum = getNodeSortNumber(a.id);
      const bNum = getNodeSortNumber(b.id);
      if (aNum !== bNum) return aNum - bNum;
      return a.id.localeCompare(b.id, undefined, { numeric: true });
    }

    function extractId(datum) {
      if (!datum || typeof datum !== "object") return "";
      if (typeof datum.id === "string") return datum.id;
      if (datum.data && typeof datum.data.id === "string") return datum.data.id;
      const meta = datum.__d3plus__;
      if (!meta) return "";
      if (typeof meta.id === "string") return meta.id;
      if (meta.data && typeof meta.data.id === "string") return meta.data.id;
      if (Array.isArray(meta.ids) && meta.ids.length) return String(meta.ids[0]);
      return "";
    }

    /* ── SVG label / edge helpers ── */
    function drawTopIdLabels() {
      const svg = document.querySelector("#viz svg");
      if (!svg) return;
      svg.querySelectorAll("text.force-id-label").forEach((n) => n.remove());
      svg.querySelectorAll("circle").forEach((circle) => {
        const parent = circle.parentNode;
        if (!parent || parent.nodeName.toLowerCase() !== "g") return;
        const id = extractId(circle.__data__) || extractId(parent.__data__);
        if (!id) return;
        const cx = Number(circle.getAttribute("cx") || 0);
        const cy = Number(circle.getAttribute("cy") || 0);
        const r  = Number(circle.getAttribute("r")  || 0);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", "force-id-label");
        label.setAttribute("x", String(cx));
        label.setAttribute("y", String(cy - r - 4));
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("dominant-baseline", "alphabetic");
        label.setAttribute("font-family", "Segoe UI, Tahoma, sans-serif");
        label.setAttribute("font-size", "9");
        label.setAttribute("fill", "#1f2937");
        label.setAttribute("stroke", "#ffffff");
        label.setAttribute("stroke-width", "2");
        label.setAttribute("paint-order", "stroke");
        label.style.pointerEvents = "none";
        label.textContent = id;
        parent.appendChild(label);
      });
    }

    function thickenEdges() {
      const svg = document.querySelector("#viz svg");
      if (!svg) return;
      svg.querySelectorAll("path, line").forEach((edge) => {
        edge.style.stroke = "#BFBFBF";
        edge.style.strokeWidth = "3.5px";
        edge.style.opacity = "0.95";
      });
    }

    function scheduleLabelRedraw() {
      setTimeout(() => { thickenEdges(); drawTopIdLabels(); }, 80);
      setTimeout(() => { thickenEdges(); drawTopIdLabels(); }, 300);
    }


    /* ── CSV parsers ── */
    function parseEdgesCsv(csvText, validNodeIds) {
      const rows = csvText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!rows.length) return [];
      const headers = rows[0].split(",").map((h) => h.trim());
      const uIdx   = headers.indexOf("u");
      const vIdx   = headers.indexOf("v");
      const simIdx = headers.indexOf("sim");
      const srcIdx = headers.indexOf("source");
      if (uIdx < 0 || vIdx < 0) throw new Error("edges.csv must include u and v columns");
      const links = [];
      const seen  = new Set();
      for (let i = 1; i < rows.length; i++) {
        const cols  = rows[i].split(",");
        const rawU  = (cols[uIdx]  || "").trim();
        const rawV  = (cols[vIdx]  || "").trim();
        const sim   = simIdx >= 0 ? num(cols[simIdx], 0) : 0;
        if (!rawU || !rawV || rawU === rawV) continue;
        if (!validNodeIds.has(rawU) || !validNodeIds.has(rawV)) continue;
        const source = rawU < rawV ? rawU : rawV;
        const target = rawU < rawV ? rawV : rawU;
        const key    = source + "|" + target;
        if (seen.has(key)) continue;
        seen.add(key);
        links.push({ source, target, sim, weight: sim, src: srcIdx >= 0 ? (cols[srcIdx] || "").trim() : "" });
      }
      return links;
    }


    // Synthetic single-snapshot "year": spec_df_base.csv has no time dimension,
    // so there are no dynamics. We key on this constant to keep the existing
    // "countryId|year" highlight machinery working unchanged.
    const SNAPSHOT_YEAR = 2022;

    // spec_df_base.csv is a WIDE country×trait binary matrix:
    //   col 0 = B_COUNTRY_ALPHA (country id), cols 1..N = trait ids (may be
    //   wider than the network: e.g. 688 traits while only 266 are nodes —
    //   extra traits are simply never matched against network nodes).
    //   cell = m_cp; treated as 1 if "1", "1.0", "true" or any number > 0.
    // There is no year/cluster/RU-name data in this file.
    function parseSpecCsv(csvText) {
      const empty = {
        countryIndicatorMap: new Map(),
        countryNameMap: new Map(),
        indicatorClusterMap: new Map(),
        availableYears: []
      };
      const stripCell = (s) =>
        (s || "").replace(/^﻿/, "").trim().replace(/^"(.*)"$/, "$1").trim();
      const isOne = (s) => {
        const v = stripCell(s);
        if (!v) return false;
        if (v === "1" || v.toLowerCase() === "true") return true;
        const n = Number(v);
        return Number.isFinite(n) && n > 0;
      };

      const rows = csvText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (rows.length < 2) return empty;

      const headers = rows[0].split(",").map(stripCell);
      if (headers.length < 2) {
        throw new Error("spec_df_base.csv must have a country column followed by trait columns");
      }
      const indicatorIds = headers.slice(1); // header cols 1..N are trait ids

      const countryMap        = new Map();  // "countryId|year" → Set<indicatorId>
      const countryNameMap    = new Map();  // no RU names in this file
      const indicatorClusterMap = new Map(); // no cluster data in this file

      for (let i = 1; i < rows.length; i++) {
        const cols      = rows[i].split(",");
        const countryId = stripCell(cols[0]);
        if (!countryId) continue;

        const key = countryId + "|" + SNAPSHOT_YEAR;
        const set = countryMap.get(key) || new Set();
        for (let c = 0; c < indicatorIds.length; c++) {
          if (isOne(cols[c + 1])) set.add(indicatorIds[c]);
        }
        countryMap.set(key, set);
      }

      return {
        countryIndicatorMap: countryMap,
        countryNameMap,
        indicatorClusterMap,
        availableYears: [SNAPSHOT_YEAR]
      };
    }


    /* ── группы: измерения и оси ── */
    function buildGroupLists() {
      const dimColor = new Map(), axisColor = new Map(), axisDim = new Map();
      state.allNodes.forEach((n) => {
        const d = state.nodeDimMap.get(n.id); const a = state.nodeAxisMap.get(n.id);
        if (d && !dimColor.has(d)) dimColor.set(d, n.color);
        if (a && !axisColor.has(a)) { axisColor.set(a, n.color); axisDim.set(a, d || ""); }
      });
      state.dimList = Array.from(dimColor.entries()).map(([name, color]) => ({ name, color }))
        .sort((a, b) => a.name.localeCompare(b.name, "ru", { numeric: true }));
      state.axisList = Array.from(axisColor.entries()).map(([name, color]) => ({ name, color, dim: axisDim.get(name) }))
        .sort((a, b) => a.name.localeCompare(b.name, "ru", { numeric: true }));
    }

    function groupNodes(kind, name) {
      const map = kind === "dim" ? state.nodeDimMap : state.nodeAxisMap;
      return state.allNodes.filter((n) => map.get(n.id) === name).map((n) => n.id);
    }

    function countryActiveSet() {
      if (!state.selectedCountryId || state.selectedYear === null) return null;
      return state.countryIndicatorMap.get(state.selectedCountryId + "|" + state.selectedYear) || new Set();
    }

    function renderChips() {
      const container = document.getElementById("dim-chips");
      const list = state.dimList;
      const selected = state.selectedDims;
      const q = (document.getElementById("dim-search").value || "").trim().toLowerCase();
      container.innerHTML = "";
      if (!list.length) { container.innerHTML = '<div style="font-size:12px;color:var(--muted)">Нет данных</div>'; return; }
      const active = countryActiveSet();
      const visibleList = q ? list.filter((d) => d.name.toLowerCase().includes(q)) : list;
      if (!visibleList.length) { container.innerHTML = '<div style="font-size:12px;color:var(--muted)">Ничего не найдено</div>'; return; }
      visibleList.forEach(({ name, color }) => {
        const ids = groupNodes("dim", name); const total = ids.length;
        let right = String(total); let title = name;
        if (active) {
          const k = ids.filter((id) => active.has(id)).length;
          right = `${k}/${total} (${total ? Math.round(100 * k / total) : 0}%)`;
          title += `: у страны RCA ≥ 1 по ${k} из ${total} характеристик`;
        }
        const chip = document.createElement("div");
        chip.className = "cluster-chip" + (selected.has(name) ? " active" : "");
        chip.style.color = color; chip.title = title;
        chip.innerHTML = `<span class="cluster-chip-swatch" style="background:${color}"></span>
          <span class="cluster-chip-name">${name}</span><span class="cluster-chip-count">${right}</span>`;
        chip.addEventListener("click", () => {
          if (selected.has(name)) selected.delete(name); else selected.add(name);
          renderChips(); renderFilterList(); applySelectionColoring();
        });
        container.appendChild(chip);
      });
    }

    /* ── подсветка ── */
    function getCountryHighlightedIds() {
      const s = countryActiveSet(); return s ? new Set(s) : new Set();
    }
    function getGroupFilterIds() {
      // null = фильтр групп не активен
      if (!state.selectedDims.size && !state.selectedAxes.size) return null;
      const ids = new Set();
      state.allNodes.forEach((n) => {
        const d = state.nodeDimMap.get(n.id), a = state.nodeAxisMap.get(n.id);
        const okDim  = !state.selectedDims.size  || (d && state.selectedDims.has(d));
        const okAxis = !state.selectedAxes.size || (a && state.selectedAxes.has(a));
        if (okDim && okAxis) ids.add(n.id);
      });
      return ids;
    }
    function getCombinedHighlightedIds() {
      const countryIds = getCountryHighlightedIds(), groupIds = getGroupFilterIds(), manual = state.selectedNodeIds;
      if (!countryIds.size && !groupIds && !manual.size) return new Set();
      const h = new Set(countryIds); manual.forEach((id) => h.add(id));
      if (groupIds) {
        if (h.size) h.forEach((id) => { if (!groupIds.has(id)) h.delete(id); });
        else groupIds.forEach((id) => h.add(id));
      }
      return h;
    }

    /* ── страна ── */
    function getCountryDisplayLabel(id) { const ru = state.countryNameMap.get(id); return ru ? ru + " (" + id + ")" : id; }
    function syncCountryFilterInput() {
      document.getElementById("country-filter").value = state.selectedCountryId ? getCountryDisplayLabel(state.selectedCountryId) : "";
    }
    function populateCountryFilter() {
      const datalist = document.getElementById("country-filter-options"); const ids = new Set();
      state.countryIndicatorMap.forEach((_, key) => ids.add(key.split("|")[0]));
      datalist.innerHTML = ""; state.countryLookup.clear();
      Array.from(ids).sort().forEach((id) => {
        const o = document.createElement("option"); o.value = getCountryDisplayLabel(id); datalist.appendChild(o);
        state.countryLookup.set(o.value, id); state.countryLookup.set(id, id);
      });
      syncCountryFilterInput();
    }

    /* ── статус ── */
    function updateStatus() {
      document.getElementById("status").textContent =
        "Узлов: " + state.allNodes.length + " | Рёбер: " + state.allLinks.length +
        " | Страна: " + (state.selectedCountryId || "—") + " | RCA≥1: " + getCountryHighlightedIds().size +
        " | Измерений: " + (state.selectedDims.size || "—") +
        " | Вручную: " + (state.selectedNodeIds.size || "—");
    }
    function updateFilterSummary() {
      const s = document.getElementById("filter-summary");
      if (!state.allNodes.length) { s.textContent = "Загрузка..."; return; }
      const parts = [];
      if (state.selectedCountryId) parts.push("Страна: " + state.selectedCountryId + " | RCA≥1: " + getCountryHighlightedIds().size);
      if (state.selectedDims.size) parts.push("Измерений: " + state.selectedDims.size);
      if (state.selectedNodeIds.size) parts.push("Вручную: " + state.selectedNodeIds.size);
      s.textContent = parts.length ? parts.join(" | ") + " → подсвечено: " + getCombinedHighlightedIds().size
                                   : "Ничего не выбрано. Узлов по поиску: " + state.visibleNodeIds.length + ".";
    }

    /* ── рендер ── */
    function getDisplayNodes() {
      const h = getCombinedHighlightedIds();
      if (!h.size) return state.allNodes.map((n) => ({ ...n, displayColor: n.color }));
      return state.allNodes.map((n) => ({ ...n, displayColor: h.has(n.id) ? n.color : mutedNodeColor }));
    }
    function renderNetwork(nodes, links) {
      const viz = document.getElementById("viz"); viz.innerHTML = "";
      new d3plus.Network().select("#viz").nodes(nodes).links(links).x("x").y("y")
        .size((d) => (d.size ? +d.size * 1.05 : 5)).sizeMin(6).sizeMax(6).label(() => "")
        .shapeConfig({ fill: (d) => d.displayColor || d.color, stroke: "#ffffff", strokeWidth: 1,
                       labelConfig: { fontResize: true, fontSize: 11, padding: 0 } })
        .tooltipConfig({
          width: 520, title: (d) => d.label || d.id,
          titleStyle: { "max-width": "100%", "white-space": "normal", "word-break": "break-word", "line-height": "1.35" },
          body: (d) => formatTooltipText(d.title),
          bodyStyle: { "max-width": "100%", "white-space": "normal", "word-break": "break-word", "line-height": "1.4", "margin-top": "8px" },
          tableStyle: { width: "100%", "table-layout": "auto" },
          tdStyle: { "white-space": "normal", "word-break": "break-word", "vertical-align": "top", "line-height": "1.35" },
          tbody: [["Код", (d) => d.id], ["Измерение", (d) => state.nodeDimMap.get(d.id) || "—"], ["Ось", (d) => state.nodeAxisMap.get(d.id) || "—"]]
        }).render();
      updateStatus(); scheduleLabelRedraw();
    }
    function applySelectionColoring() { renderNetwork(getDisplayNodes(), state.allLinks); renderChips(); updateFilterSummary(); }

    function renderFilterList() {
      const q = document.getElementById("node-search").value.trim().toLowerCase();
      const groupIds = getGroupFilterIds();
      const m = state.allNodes.filter((n) => {
        if (q && !(n.id.toLowerCase().includes(q) || (n.label || "").toLowerCase().includes(q))) return false;
        if (groupIds && !groupIds.has(n.id)) return false;
        return true;
      });
      state.visibleNodeIds = m.map((n) => n.id); updateFilterSummary();
    }

    /* ── main ── */
    async function main() {
      document.getElementById("status").textContent = `Loading ${NODES_FILE}, ${EDGES_FILE}, ${SPEC_FILE}...`;
      const [nodesRes, edgesRes, specRes] = await Promise.all([
        fetch(NODES_FILE, { cache: "no-store" }), fetch(EDGES_FILE, { cache: "no-store" }), fetch(SPEC_FILE, { cache: "no-store" })
      ]);
      if (!nodesRes.ok) throw new Error("Could not load " + NODES_FILE);
      if (!edgesRes.ok) throw new Error("Could not load " + EDGES_FILE);
      if (!specRes.ok)  throw new Error("Could not load " + SPEC_FILE);
      const rawNodes = await nodesRes.json(); const edgesCsv = await edgesRes.text(); const specCsv = await specRes.text();
      const nodes = rawNodes.filter((d) => d && d.id).map((d) => ({
        id: d.id, label: d.label || d.id, title: d.title || "", x: num(d.x, 0), y: num(d.y, 0),
        size: num(d.size, 5), color: d.color || "#4e79a7", value: num(d.value, 0),
        dimension: String(d.dimension || d.cluster || "").trim(), axis: String(d.axis || "").trim()
      }));
      const valid = new Set(nodes.map((n) => n.id));
      state.allNodes = nodes.slice().sort(compareNodesByIdNumber);
      state.allLinks = parseEdgesCsv(edgesCsv, valid);
      const spec = parseSpecCsv(specCsv);
      state.countryIndicatorMap = spec.countryIndicatorMap; state.countryNameMap = spec.countryNameMap; state.availableYears = spec.availableYears;
      state.selectedYear = SNAPSHOT_YEAR;
      nodes.forEach((n) => { if (n.dimension) state.nodeDimMap.set(n.id, n.dimension); if (n.axis) state.nodeAxisMap.set(n.id, n.axis); });
      buildGroupLists(); populateCountryFilter(); renderChips();

      document.getElementById("clear-dim-filter").addEventListener("click", () => { state.selectedDims.clear(); renderChips(); renderFilterList(); applySelectionColoring(); });
      document.getElementById("dim-search").addEventListener("input", () => renderChips());

      const cf = document.getElementById("country-filter");
      const applyCountry = () => {
        const raw = cf.value.trim();
        if (!raw) { state.selectedCountryId = ""; applySelectionColoring(); return; }
        const m = state.countryLookup.get(raw) || state.countryLookup.get(raw.toUpperCase()); if (!m) return;
        state.selectedCountryId = m; syncCountryFilterInput(); applySelectionColoring();
      };
      cf.addEventListener("change", applyCountry);
      cf.addEventListener("input", () => { if (!cf.value.trim()) { state.selectedCountryId = ""; applySelectionColoring(); } });
      document.getElementById("clear-country-filter").addEventListener("click", () => { state.selectedCountryId = ""; syncCountryFilterInput(); applySelectionColoring(); });
      document.getElementById("node-search").addEventListener("input", renderFilterList);
      document.getElementById("select-visible").addEventListener("click", () => { state.visibleNodeIds.forEach((id) => state.selectedNodeIds.add(id)); renderFilterList(); applySelectionColoring(); });
      document.getElementById("clear-selection").addEventListener("click", () => {
        state.selectedCountryId = ""; state.selectedNodeIds.clear(); state.selectedDims.clear(); state.selectedAxes.clear();
        syncCountryFilterInput(); renderChips(); renderFilterList(); applySelectionColoring();
      });
      renderFilterList(); applySelectionColoring();
      window.addEventListener("resize", () => setTimeout(drawTopIdLabels, 120));
      document.getElementById("viz").addEventListener("mouseup", () => setTimeout(drawTopIdLabels, 90));
      document.getElementById("viz").addEventListener("wheel", () => setTimeout(drawTopIdLabels, 90), { passive: true });
    }
    main().catch((err) => { document.getElementById("status").textContent = "Error: " + err.message; console.error(err); });
  </script>
</body>
</html>
